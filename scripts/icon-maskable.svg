<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="maskable-squircle">
      <rect x="64" y="64" width="384" height="384" rx="84"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background for Android safe-zone masking -->
  <rect width="512" height="512" fill="#17181A"/>

  <g clip-path="url(#maskable-squircle)">
    <!-- Base dark background for divider grid lines -->
    <rect x="64" y="64" width="384" height="384" fill="#17181A"/>

    <!-- Quadrants -->
    <rect x="64" y="64" width="190" height="190" fill="#2C2C2E"/>
    <rect x="258" y="64" width="190" height="190" fill="#2C2C2E"/>
    <rect x="64" y="258" width="190" height="190" fill="#2C2C2E"/>
    <rect x="258" y="258" width="190" height="190" fill="#FF9500"/>

    <!-- Symbols -->
    <!-- Top-Left: Plus (+) -->
    <line x1="121" y1="159" x2="197" y2="159" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <line x1="159" y1="121" x2="159" y2="197" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

    <!-- Top-Right: Minus (−) -->
    <line x1="315" y1="159" x2="391" y2="159" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

    <!-- Bottom-Left: Multiply (×) -->
    <line x1="132" y1="326" x2="186" y2="380" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <line x1="186" y1="326" x2="132" y2="380" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

    <!-- Bottom-Right: Equals (=) -->
    <line x1="315" y1="337" x2="391" y2="337" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <line x1="315" y1="369" x2="391" y2="369" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
